<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

html:not(.access-granted) body > :not(#accessGate){
    display:none !important;
}

#accessGate{
    display:none;
}

html:not(.access-granted) #accessGate{
    position:fixed;
    inset:0;
    z-index:9999;
    display:grid;
    place-items:center;
    padding:24px;
    background:#f4f6f8;
}

#accessGate .card{
    width:min(100%, 420px);
}

#accessError{
    margin-top:10px;
}

body{
    font-family:Segoe UI, Arial, sans-serif;
    background:#f4f6f8;
    color:#333;
}

header{
    background:#005A9C;
    color:white;
    padding:25px;
    text-align:center;
}

header h1{
    margin-bottom:10px;
}

.container{
    max-width:1400px;
    margin:auto;
    padding:20px;
}

.stats{
    display:grid;
    grid-template-columns:repeat(auto-fit,minmax(220px,1fr));
    gap:15px;
    margin-bottom:25px;
}

.card{
    background:white;
    padding:20px;
    border-radius:12px;
    box-shadow:0 2px 10px rgba(0,0,0,.08);
}

.card h3{
    margin-bottom:10px;
}

.chapter-grid{
    display:grid;
    grid-template-columns:repeat(auto-fill,minmax(300px,1fr));
    gap:20px;
}

.chapter-card{
    display:flex;
    flex-direction:column;
    height:100%;
    background:white;
    border-radius:12px;
    overflow:hidden;
    box-shadow:0 3px 15px rgba(0,0,0,.08);
}

.chapter-card.is-complete{
    outline:2px solid #107C10;
    outline-offset:-2px;
}

.chapter-thumbnail-wrap{
    position:relative;
    aspect-ratio:16 / 9;
    background:#18252b;
}

.chapter-thumbnail{
    display:block;
    width:100%;
    height:100%;
    object-fit:cover;
}

.thumbnail-message{
    position:absolute;
    inset:0;
    display:grid;
    place-items:center;
    padding:12px;
    color:white;
    text-align:center;
    background:#18252b;
    pointer-events:none;
}

.chapter-thumbnail-wrap.is-ready .thumbnail-message{
    display:none;
}

.chapter-header{
    display:flex;
    align-items:center;
    height:78px;
    flex:0 0 78px;
    background:#0078D4;
    color:white;
    padding:15px;
    font-weight:bold;
    font-size:18px;
}

.chapter-header span{
    display:-webkit-box;
    -webkit-box-orient:vertical;
    line-clamp:2;
    -webkit-line-clamp:2;
    overflow:hidden;
}

.chapter-body{
    flex:1;
    padding:20px;
}

.completion-status{
    min-height:20px;
    margin-top:8px;
    color:#107C10;
    font-weight:600;
}

.completed-section{
    margin-top:28px;
    padding-top:20px;
    border-top:1px solid #d5dadd;
}

.completed-section h2{
    margin-bottom:12px;
}

.completed-chapter-list{
    display:grid;
    grid-template-columns:repeat(auto-fit,minmax(260px,1fr));
    gap:8px 24px;
    padding-left:24px;
}

.completed-chapter-list li{
    padding:6px 0;
    border-bottom:1px solid #e3e7e9;
}

.button{
    display:inline-block;
    background:#0078D4;
    color:white;
    text-decoration:none;
    border:none;
    cursor:pointer;
    padding:10px 16px;
    border-radius:6px;
    margin-top:10px;
}

.button:hover{
    background:#106ebe;
}

.button.green{
    background:#107C10;
}

.button.green:hover{
    background:#0b6a0b;
}

.chapter-viewer{
    margin:30px 0;
    background:white;
    border-radius:12px;
    box-shadow:0 3px 15px rgba(0,0,0,.08);
    scroll-margin-top:20px;
}

.chapter-viewer[hidden]{
    display:none;
}

.viewer-header{
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:16px;
    background:#0078D4;
    color:white;
    padding:16px 20px;
    border-radius:12px 12px 0 0;
}

.viewer-header h2{
    margin:0;
}

.viewer-actions{
    display:flex;
    flex-wrap:wrap;
    align-items:center;
    justify-content:flex-end;
    gap:8px;
}

.viewer-actions .button{
    margin:0;
}

#previousChapterButton[hidden],
#nextChapterButton[hidden]{
    display:none;
}

.viewer-navigation-button{
    background:#005A9C;
}

.viewer-navigation-button:hover{
    background:#004578;
}

.viewer-navigation-button:disabled{
    cursor:not-allowed;
    opacity:.55;
}

.viewer-close{
    flex-shrink:0;
    background:white;
    color:#005A9C;
    font-weight:600;
}

.viewer-close:hover{
    background:#e8f4fc;
}

.viewer-body{
    padding:20px;
}

@media (max-width:640px){
    .viewer-header{
        align-items:flex-start;
        flex-direction:column;
    }

    .viewer-actions{
        width:100%;
        justify-content:flex-start;
    }
}

.video-container{
    position:relative;
    margin-bottom:20px;
}

.video-container video{
    width:100%;
    max-height:500px;
    background:black;
    border-radius:10px;
}

.video-loading{
    display:flex;
    align-items:center;
    justify-content:center;
    gap:12px;
    min-height:220px;
    padding:20px;
    border-radius:10px;
    background:#18252b;
    color:white;
}

.loading-spinner{
    width:22px;
    height:22px;
    flex:0 0 22px;
    border:3px solid rgba(255,255,255,.35);
    border-top-color:white;
    border-radius:50%;
    animation:loading-spin .8s linear infinite;
}

@keyframes loading-spin{
    to{transform:rotate(360deg);}
}

@media (prefers-reduced-motion: reduce){
    .loading-spinner{
        animation:none;
    }
}

.video-navigation{
    margin-top:12px;
    padding:16px;
    border:1px solid #d5dadd;
    border-radius:10px;
    background:#f7f9fb;
}

.video-navigation h3{
    margin-bottom:8px;
}

.video-navigation p{
    color:#55616b;
}

.subtitle-search{
    width:100%;
    margin-top:10px;
    padding:10px 12px;
    border:1px solid #aeb8bf;
    border-radius:6px;
    font:inherit;
}

.topic-jumps{
    display:flex;
    flex-wrap:wrap;
    gap:8px;
    margin-top:12px;
}

.topic-jump{
    margin-top:0;
    padding:8px 12px;
}

.subtitle-search-results{
    display:grid;
    gap:6px;
    max-height:220px;
    margin-top:12px;
    overflow-y:auto;
}

.subtitle-result{
    width:100%;
    padding:8px 10px;
    border:1px solid #d5dadd;
    border-radius:6px;
    background:white;
    color:inherit;
    cursor:pointer;
    font:inherit;
    text-align:left;
}

.subtitle-result:hover{
    background:#edf5fb;
}

.question{
    background:#f9f9f9;
    padding:15px;
    margin-bottom:15px;
    border-radius:8px;
}

.question.is-correct{
    border-left:4px solid #107C10;
}

.question.is-incorrect,
.question.is-unanswered{
    border-left:4px solid #b42318;
}

.question.is-ungraded{
    border-left:4px solid #8a6d00;
}

.option{
    margin:8px 0;
}

.option label.is-correct-option{
    color:#0b6a0b;
    font-weight:600;
}

.option label.is-incorrect-option{
    color:#b42318;
    font-weight:600;
}

.quiz-feedback{
    margin-top:12px;
    font-weight:600;
    white-space:pre-line;
}

.progress{
    height:20px;
    background:#ddd;
    border-radius:20px;
    overflow:hidden;
}

.progress-bar{
    height:100%;
    width:0%;
    background:#107C10;
}

footer{
    text-align:center;
    padding:30px;
    color:#666;
}
</style>

<script>
const accessError = document.getElementById("accessError");
if (!document.documentElement.classList.contains("access-granted")) {
    accessError.textContent =
        "This link is missing a valid access key. If the link has been reset, request an updated link.";
}

const chapters = window.chapters || [];
const practices = window.practices || [];

let currentChapter = null;
let currentPractice = null;
let currentQuestions = [];
let currentQuizKey = "";
let activeVideoLoadId = 0;
let activeVideoChapterId = null;
const questionOrderCache = new Map();
const optionOrderCache = new Map();

const subtitleTopicSuggestions = [
    { label: "RIBO & regulation", terms: ["ribo", "regulat", "government", "licens", "fsra"] },
    { label: "Risk", terms: ["risk", "peril", "hazard"] },
    { label: "Policies & contracts", terms: ["policy", "contract"] },
    { label: "Broker responsibilities", terms: ["broker"] },
    { label: "Claims & payouts", terms: ["claim", "indemnif", "settlement"] },
    { label: "Property coverage", terms: ["property", "homeowner", "contents"] },
    { label: "Liability coverage", terms: ["liability", "negligence", "third-party"] },
    { label: "Auto insurance", terms: ["automobile", "auto insurance", "accident benefits", "vehicle"] },
    { label: "Commercial coverage", terms: ["commercial", "business interruption"] },
    { label: "Travel medical", terms: ["travel health", "travel medical", "emergency medical"] }
];

function formatVideoTime(seconds){
    const totalSeconds = Math.floor(seconds);
    const hours = Math.floor(totalSeconds / 3600);
    const minutes = Math.floor((totalSeconds % 3600) / 60);
    const remainingSeconds = totalSeconds % 60;

    if (hours > 0) {
        return `${hours}:${String(minutes).padStart(2, "0")}:${String(remainingSeconds).padStart(2, "0")}`;
    }

    return `${minutes}:${String(remainingSeconds).padStart(2, "0")}`;
}

function seekVideoToCue(video, cue){
    video.currentTime = cue.startTime;
}

function showChapterViewer(){
    const viewer = document.getElementById("chapterViewer");
    viewer.hidden = false;
    viewer.scrollIntoView({
        behavior: window.matchMedia("(prefers-reduced-motion: reduce)").matches ? "auto" : "smooth",
        block: "start"
    });
    document.getElementById("chapterViewerTitle").focus({ preventScroll: true });
}

function renderVideoNavigation(video, textTrack, navigation){
    const cues = Array.from(textTrack.cues || []);
    const topicJumps = navigation.querySelector(".topic-jumps");
    const searchInput = navigation.querySelector(".subtitle-search");
    const searchResults = navigation.querySelector(".subtitle-search-results");

    if (cues.length === 0) {
        searchResults.textContent = "No subtitle cues are available for this video.";
        return;
    }

    const topicCues = subtitleTopicSuggestions.map((topic, index) => {
        const cue = cues.find(item => {
            const text = item.text.toLowerCase();
            return item.startTime >= 60 && topic.terms.some(term => text.includes(term));
        });

        return cue ? { topic, cue, index } : null;
    }).filter(Boolean).sort((a, b) => a.cue.startTime - b.cue.startTime || a.index - b.index);

    topicCues.forEach(({ topic, cue }) => {
        const button = document.createElement("button");
        button.type = "button";
        button.className = "button topic-jump";
        button.textContent = `${topic.label} - ${formatVideoTime(cue.startTime)}`;
        button.setAttribute("aria-label", `Skip to ${topic.label} at ${formatVideoTime(cue.startTime)}`);
        button.addEventListener("click", () => seekVideoToCue(video, cue));
        topicJumps.appendChild(button);
    });

    function renderSearchResults(){
        const query = searchInput.value.trim().toLowerCase();
        searchResults.replaceChildren();

        if (!query) {
            searchResults.textContent = "Search the transcript to find a specific topic or phrase.";
            return;
        }

        const matches = cues.filter(cue => cue.text.toLowerCase().includes(query));
        if (matches.length === 0) {
            searchResults.textContent = "No matching subtitle lines found.";
            return;
        }

        const status = document.createElement("p");
        const visibleMatches = matches.slice(0, 20);
        status.textContent = matches.length > visibleMatches.length
            ? `Showing the first ${visibleMatches.length} of ${matches.length} matches.`
            : `${matches.length} ${matches.length === 1 ? "match" : "matches"}.`;
        searchResults.appendChild(status);

        visibleMatches.forEach(cue => {
            const button = document.createElement("button");
            button.type = "button";
            button.className = "subtitle-result";
            button.textContent = `${formatVideoTime(cue.startTime)} - ${cue.text}`;
            button.addEventListener("click", () => seekVideoToCue(video, cue));
            searchResults.appendChild(button);
        });
    }

    searchInput.addEventListener("input", renderSearchResults);
    renderSearchResults();
}

function attachSubtitleTrack(video, videoUrl, onTrackLoad, onTrackError){
    if (!video || !videoUrl) return;

    const subtitleUrl = videoUrl.replace(/\.mp4$/i, ".vtt");
    const track = document.createElement("track");
    track.kind = "captions";
    track.label = "English";
    track.srclang = "en";
    track.src = subtitleUrl;
    track.default = true;
    if (onTrackLoad) {
        track.addEventListener("load", () => onTrackLoad(track.track), { once: true });
    }
    if (onTrackError) {
        track.addEventListener("error", onTrackError, { once: true });
    }
    video.appendChild(track);

    if (video.textTracks && video.textTracks.length > 0) {
        video.textTracks[0].mode = "showing";
    }
}

function renderChapters(){

    const grid = document.getElementById("chapterGrid");
    document.getElementById("totalChapters").innerText = chapters.length;

    grid.innerHTML = chapters.map(chapter => `
        <div class="chapter-card" data-chapter-id="${chapter.id}">

            <div class="chapter-header">
                <span>${chapter.title}</span>
            </div>

            <div class="chapter-thumbnail-wrap" id="thumbnail-${chapter.id}">
                <video
                    class="chapter-thumbnail"
                    src="${chapter.video}"
                    muted
                    playsinline
                    preload="metadata"
                    aria-label="First frame of ${chapter.title} video">
                </video>
                <div class="thumbnail-message">Loading video preview...</div>
            </div>

            <div class="chapter-body">

                <p>
                    ${chapter.questions.length} practice questions
                </p>

                <p class="completion-status" aria-live="polite"></p>

                <button
                    class="button"
                    onclick="openChapter(${chapter.id})">
                    Open Chapter
                </button>

            </div>

        </div>
    `).join("");

    grid.querySelectorAll(".chapter-thumbnail").forEach(video=>{
        const chapter = chapters.find(item => item.video === video.getAttribute("src"));
        if (chapter) {
            attachSubtitleTrack(video, chapter.video);
        }

        const thumbnail = video.closest(".chapter-thumbnail-wrap");
        const showThumbnail = () => {
            video.pause();
            thumbnail.classList.add("is-ready");
        };
        const showError = () => {
            thumbnail.querySelector(".thumbnail-message").textContent = "Video preview unavailable";
        };

        video.addEventListener("loadeddata", showThumbnail, { once: true });
        video.addEventListener("error", showError, { once: true });

        if (video.readyState >= HTMLMediaElement.HAVE_CURRENT_DATA) {
            showThumbnail();
        } else if (video.error) {
            showError();
        }
    });
}

function renderPractices(){

    const grid = document.getElementById("practiceGrid");
    grid.innerHTML = practices.map(practice => `
        <div class="chapter-card">
            <div class="chapter-header">
                <span>${practice.title}</span>
            </div>
            <div class="chapter-body">
                <p>${practice.questions.length} practice questions</p>
                <button class="button" onclick="openPractice(${practice.id})">
                    Start Practice
                </button>
            </div>
        </div>
    `).join("");
}

function updateChapterNavigation(){
    const isChapter = Boolean(currentChapter) && !currentPractice;
    const chapterIndex = isChapter
        ? chapters.findIndex(chapter => chapter.id === currentChapter.id)
        : -1;
    const previousButton = document.getElementById("previousChapterButton");
    const nextButton = document.getElementById("nextChapterButton");

    previousButton.hidden = !isChapter;
    previousButton.disabled = chapterIndex <= 0;
    nextButton.hidden = !isChapter;
    nextButton.disabled = chapterIndex < 0 || chapterIndex >= chapters.length - 1;
}

function navigateChapter(offset){
    if (!currentChapter) return;

    const chapterIndex = chapters.findIndex(chapter => chapter.id === currentChapter.id);
    const chapter = chapters[chapterIndex + offset];
    if (chapter) openChapter(chapter.id);
}

function openChapter(id){

    const chapter = chapters.find(c => c.id === id);
    if (!chapter) return;

    const videoArea = document.getElementById("videoArea");
    const chapterViewerTitle = document.getElementById("chapterViewerTitle");
    currentPractice = null;
    currentChapter = chapter;

    chapterViewerTitle.innerText = chapter.title;
    updateChapterNavigation();

    if (
        activeVideoChapterId === chapter.id
        && videoArea.querySelector("video")
    ) {
        videoArea.style.display = "";
        renderQuiz(chapter);
        return;
    }

    const previousVideo = videoArea.querySelector("video");
    if (previousVideo) previousVideo.pause();
    videoArea.replaceChildren();
    videoArea.style.display = "";
    const videoLoadId = ++activeVideoLoadId;
    activeVideoChapterId = chapter.video ? chapter.id : null;

    if (chapter.video) {
        const video = document.createElement("video");
        video.controls = true;
        video.preload = "metadata";
        video.hidden = true;

        const navigation = document.createElement("section");
        navigation.className = "video-navigation";
        navigation.setAttribute("aria-label", "Subtitle topic navigation");
        navigation.innerHTML = `
            <h3>Jump to a topic</h3>
            <p>Choose a suggested topic or search this video's subtitles.</p>
            <div class="topic-jumps" aria-label="Suggested topic jumps"></div>
            <label for="subtitleSearch">Search subtitles</label>
            <input
                class="subtitle-search"
                id="subtitleSearch"
                type="search"
            >
            <div class="subtitle-search-results" aria-live="polite">
                Loading subtitle topics...
            </div>
        `;
        const loading = document.createElement("div");
        loading.className = "video-loading";
        loading.setAttribute("role", "status");
        const spinner = document.createElement("span");
        spinner.className = "loading-spinner";
        spinner.setAttribute("aria-hidden", "true");
        const loadingMessage = document.createElement("span");
        loadingMessage.textContent = `Loading ${chapter.title} video...`;
        loading.append(spinner, loadingMessage);

        videoArea.append(loading, video);
        video.addEventListener("loadeddata", () => {
            if (videoLoadId !== activeVideoLoadId || !currentChapter || currentChapter.id !== chapter.id) return;
            video.hidden = false;
            videoArea.replaceChildren(video, navigation);
        }, { once: true });
        video.addEventListener("error", () => {
            if (videoLoadId !== activeVideoLoadId || !currentChapter || currentChapter.id !== chapter.id) return;
            if (window.location.protocol === "file:") {
                videoArea.innerHTML = "Videos need the portal to run through a local web server. Double-click <strong>start.bat</strong> in the project folder, then open <a href=\"http://localhost:8000\">http://localhost:8000</a>.";
            } else {
                videoArea.textContent = `Unable to load video: ${chapter.video}`;
            }
        });
        attachSubtitleTrack(
            video,
            chapter.video,
            textTrack => renderVideoNavigation(video, textTrack, navigation),
            () => {
                navigation.querySelector(".subtitle-search-results").textContent =
                    "Unable to load subtitles for this video.";
            }
        );
        video.src = chapter.video;
    } else {
        videoArea.textContent = "No video is available for this chapter.";
    }

    renderQuiz(chapter);

}

function openPractice(id){

    currentPractice = practices.find(practice => practice.id === id);
    currentChapter = null;

    if (!currentPractice) return;

    updateChapterNavigation();
    activeVideoLoadId++;
    activeVideoChapterId = null;
    document.getElementById("chapterViewerTitle").innerText = currentPractice.title;
    const videoArea = document.getElementById("videoArea");
    const previousVideo = videoArea.querySelector("video");
    if (previousVideo) previousVideo.pause();
    videoArea.replaceChildren();
    videoArea.style.display = "none";

    renderQuiz(currentPractice);
}

function renderQuiz(quiz){

    currentQuizKey = `${currentPractice ? "practice" : "chapter"}-${quiz.id}`;
    const savedAnswers = getSavedAnswers(currentQuizKey);
    currentQuestions = shuffleItems(
        quiz.questions,
        `${currentQuizKey}-questions`,
        questionOrderCache,
        question => question.id
    ).map(question => {
        const options = shuffleItems(
            question.options.map((text, index) => ({ text, index })),
            `${currentQuizKey}-question-${question.id}-options`,
            optionOrderCache,
            option => option.index
        );

        return {
            ...question,
            options: options.map(option => option.text),
            optionSourceIndexes: options.map(option => option.index),
            answer: Number.isInteger(question.answer)
                ? options.findIndex(option => option.index === question.answer)
                : question.answer
        };
    });

    let quizHtml = "";

    if (currentQuestions.length === 0) {
        quizHtml = `
        <div class="question">
            No questions entered yet.
        </div>`;
    }

    currentQuestions.forEach((question, index) => {
        quizHtml += `
        <div class="question" data-question-index="${index}">
            <h4>${index + 1}. ${question.question}</h4>
            ${question.options.map((option, optionIndex) => `
            <div class="option">
                <label>
                    <input type="radio" name="q${index}" value="${optionIndex}" ${question.optionSourceIndexes[optionIndex] === savedAnswers[question.id] ? "checked" : ""}>
                    ${option}
                </label>
            </div>
            `).join("")}
            <div class="quiz-feedback" aria-live="polite"></div>
        </div>
        `;
    });

    document.getElementById("quizArea").innerHTML = quizHtml;
    document.getElementById("resultArea").innerHTML = "";
    showChapterViewer();

}

function shuffleItems(items, cacheKey, orderCache, getKey){

    const cachedOrder = orderCache.get(cacheKey);
    if (cachedOrder) {
        const itemsByKey = new Map(items.map(item => [getKey(item), item]));
        if (cachedOrder.length === items.length && cachedOrder.every(key => itemsByKey.has(key))) {
            return cachedOrder.map(key => itemsByKey.get(key));
        }
    }

    const shuffled = [...items];

    for (let index = shuffled.length - 1; index > 0; index--){
        const randomIndex = Math.floor(Math.random() * (index + 1));
        [shuffled[index], shuffled[randomIndex]] = [shuffled[randomIndex], shuffled[index]];
    }

    orderCache.set(cacheKey, shuffled.map(getKey));
    return shuffled;
}

function closeChapterViewer(){
    const video = document.querySelector("#videoArea video");
    if (video) video.pause();
    document.getElementById("chapterViewer").hidden = true;
    const returnHeading = document.getElementById(
        currentPractice ? "practiceGridHeading" : "chapterGridHeading"
    );
    returnHeading.scrollIntoView({
        behavior: window.matchMedia("(prefers-reduced-motion: reduce)").matches ? "auto" : "smooth",
        block: "start"
    });
    returnHeading.focus({ preventScroll: true });
}

document.getElementById("quizArea").addEventListener("change", event => {
    const input = event.target;
    if (!(input instanceof HTMLInputElement) || input.type !== "radio") return;

    const questionIndex = Number(input.name.slice(1));
    const question = currentQuestions[questionIndex];
    if (!question) return;

    saveQuizAnswer(
        currentQuizKey,
        question.id,
        question.optionSourceIndexes[Number(input.value)]
    );
});

function getSavedAnswers(quizKey){
    try {
        const savedAnswers = JSON.parse(localStorage.getItem("quizAnswers") || "{}");
        return savedAnswers[quizKey] || {};
    } catch (error) {
        return {};
    }
}

function saveQuizAnswer(quizKey, questionId, optionIndex){
    try {
        const savedAnswers = JSON.parse(localStorage.getItem("quizAnswers") || "{}");
        const quizAnswers = savedAnswers[quizKey] || {};
        quizAnswers[questionId] = optionIndex;
        savedAnswers[quizKey] = quizAnswers;
        localStorage.setItem("quizAnswers", JSON.stringify(savedAnswers));
    } catch (error) {
        // Keep the quiz usable if browser storage is unavailable.
    }
}

function submitQuiz(){

    const activeQuiz = currentPractice || currentChapter;
    if (!activeQuiz) return;

    let score = 0;
    let gradedCount = 0;
    let incorrectCount = 0;
    let unansweredCount = 0;
    let ungradedCount = 0;

    currentQuestions.forEach((question, index) => {
        const card = document.querySelector(
            `.question[data-question-index='${index}']`
        );
        const feedback = card.querySelector(".quiz-feedback");
        const selected = card.querySelector("input:checked");
        const hasAnswerKey = Number.isInteger(question.answer)
            && question.answer >= 0
            && question.answer < question.options.length;

        if (!hasAnswerKey) {
            card.classList.add("is-ungraded");
            feedback.textContent = "Not graded: no valid answer key is set for this question.";
            ungradedCount++;
            return;
        }

        gradedCount++;
        const correctLabel = card.querySelector(`input[value='${question.answer}']`).parentElement;
        correctLabel.classList.add("is-correct-option");

        if (selected && Number(selected.value) === question.answer) {
            card.classList.add("is-correct");
            feedback.textContent = "Correct.";
            score++;
            return;
        }

        if (selected) {
            card.classList.add("is-incorrect");
            selected.parentElement.classList.add("is-incorrect-option");
            feedback.textContent = `Incorrect. Correct answer: ${question.options[question.answer]}`;
            incorrectCount++;
        } else {
            card.classList.add("is-unanswered");
            feedback.textContent = `Not answered. Correct answer: ${question.options[question.answer]}`;
            unansweredCount++;
        }

        if (question.explanation) {
            feedback.textContent += `\n${question.explanation}`;
        }
    });

    document.getElementById("resultArea").innerHTML = `
        <h3>Score: ${score} / ${gradedCount}</h3>
        <p>${incorrectCount} incorrect, ${unansweredCount} unanswered, ${ungradedCount} not graded.</p>
    `;

    if (currentChapter && gradedCount === currentQuestions.length) {
        markComplete(currentChapter.id);
    }

}

function markComplete(id){

    const completed = getCompleted();

    if(!completed.includes(id))
        completed.push(id);

    try {
        localStorage.setItem("completed", JSON.stringify(completed));
    } catch (error) {
        // Progress still updates for this page session when storage is unavailable.
    }

    updateProgress();
}

function getCompleted(){
    try {
        const completed = JSON.parse(localStorage.getItem("completed") || "[]");
        return Array.isArray(completed) ? completed : [];
    } catch (error) {
        return [];
    }
}

function updateProgress(){

    const completed = getCompleted();
    const completedIds = new Set(
        completed.filter(id => chapters.some(chapter => chapter.id === id))
    );

    document.getElementById("completedCount")
        .innerText = completedIds.size;

    const completedChapters = chapters.filter(chapter => completedIds.has(chapter.id));
    document.getElementById("completedChapterList").innerHTML = completedChapters
        .map(chapter => `<li>${chapter.title}</li>`)
        .join("");
    document.getElementById("completedEmpty").hidden = completedChapters.length > 0;

    document.querySelectorAll(".chapter-card[data-chapter-id]").forEach(card => {
        const isComplete = completedIds.has(Number(card.dataset.chapterId));
        card.classList.toggle("is-complete", isComplete);
        card.querySelector(".completion-status").textContent = isComplete ? "Completed" : "";
    });

    const percent =
        chapters.length ? (completedIds.size / chapters.length) * 100 : 0;

    document.getElementById("progressBar")
        .style.width = percent + "%";
}

window.openChapter = openChapter;
window.openPractice = openPractice;
window.closeChapterViewer = closeChapterViewer;
window.submitQuiz = submitQuiz;

renderChapters();
renderPractices();
updateProgress();
</script>
